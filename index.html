<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LVConnect Transport Test</title>
<style>
  body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;min-height:100vh;display:grid;place-items:center}
  .card{background:#fff;width:min(520px,90vw);padding:32px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
  h1{margin-top:0}
  button{padding:12px 18px;border:0;border-radius:10px;cursor:pointer}
  #status{margin-top:20px;padding:14px;border-radius:10px;background:#eee;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
  <h1>LVConnect Transport Test</h1>
  <p>This page tests only whether GitHub Pages can receive a harmless response from the Apps Script deployment.</p>
  <button id="test">TEST CONNECTION</button>
  <div id="status">Not tested.</div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzWJRWbgAQ1Rmyeew-ebv4ikuLPeb90xXUwRPgFS42fd80a8xYB1IC5n6DBtsJSMzBUsw/exec';
const statusEl = document.getElementById('status');
const button = document.getElementById('test');

function runTest(){
  statusEl.textContent = 'Testing...';
  const cb = '__lvconnectTransportTest_' + Date.now() + '_' +
             Math.random().toString(36).slice(2);

  const script = document.createElement('script');
  let finished = false;

  function finish(ok, text){
    if(finished) return;
    finished = true;
    clearTimeout(timer);
    try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
    try{ script.remove(); }catch(e){}
    statusEl.textContent = text;
  }

  window[cb] = function(result){
    finish(
      !!(result && result.success),
      'CONNECTED\n\nApps Script response received:\n' +
      JSON.stringify(result, null, 2)
    );
  };

  const timer = setTimeout(function(){
    finish(false,
      'FAILED\n\nGitHub did not receive the Apps Script response within 15 seconds.'
    );
  },15000);

  script.onerror = function(){
    finish(false,
      'FAILED\n\nThe browser could not load the Apps Script response.'
    );
  };

  script.src = API_URL +
    (API_URL.indexOf('?') >= 0 ? '&' : '?') +
    'callback=' + encodeURIComponent(cb) +
    '&transportTest=1&_=' + Date.now();

  document.head.appendChild(script);
}

button.addEventListener('click', runTest);
</script>
</body>
</html>
